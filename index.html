<html lang="en">
<head>

<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121718" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen phone app. A wall of white lacquered shelves with a maple cubby,
   drawn as a tappable map; each shelf opens to life-size spines. Bottom tab bar. */
:root{
  --bg:#eef1f0;          /* painted wall */
  --surface:#ffffff;     /* lacquered shelf board */
  --ink:#1c2629;
  --muted:#5f6d70;
  --line:#d6dddc;
  --maple:#c88a45;       /* the wood cubby */
  --maple-soft:#f3e3cf;
  --accent:#167a8b;      /* turquoise glass on the shelf */
  --accent-ink:#ffffff;
  --glow:#ffb347;
  --shelf-shadow:rgba(28,38,41,.12);
  --scrim:rgba(18,24,26,.45);
  --good:#2f7d4f;
  --warn:#a5641a;
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-code:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121718;--surface:#1b2224;--ink:#e4ecec;--muted:#93a3a5;--line:#2c3739;
  --maple:#d79b56;--maple-soft:#3a2c1d;--accent:#4cb8c9;--accent-ink:#0b1416;--glow:#ffbe5c;
  --shelf-shadow:rgba(0,0,0,.45);--scrim:rgba(0,0,0,.6);--good:#6cc08f;--warn:#e0a35a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121718;--surface:#1b2224;--ink:#e4ecec;--muted:#93a3a5;--line:#2c3739;
  --maple:#d79b56;--maple-soft:#3a2c1d;--accent:#4cb8c9;--accent-ink:#0b1416;--glow:#ffbe5c;
  --shelf-shadow:rgba(0,0,0,.45);--scrim:rgba(0,0,0,.6);--good:#6cc08f;--warn:#e0a35a;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0;color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:left}
.gate-mark{display:flex;align-items:flex-end;gap:3px;height:96px;padding:0 4px;border-bottom:6px solid var(--line)}
.gate-mark i{display:block;width:16px;border-radius:2px 2px 0 0}
.syncchip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.25rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.code{font-family:var(--font-code);font-weight:500}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack-v{display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 14px}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;flex-shrink:0}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.8rem}
.banner{background:var(--maple-soft);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}

/* ---------- wall map ---------- */
.wall{display:grid;grid-template-columns:1fr .56fr .44fr;grid-template-rows:1fr 1fr 1fr 1.6fr 1.25fr 1.9fr;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;aspect-ratio:3/3.6;max-height:560px;width:100%;box-shadow:0 6px 18px var(--shelf-shadow)}
.wall.small{aspect-ratio:auto;height:150px;max-width:150px;gap:2px;padding:3px;box-shadow:none}
.cell{position:relative;border:0;background:var(--bg);border-radius:2px;display:flex;align-items:flex-end;justify-content:flex-start;gap:1px;padding:16px 3px 0;overflow:hidden;cursor:pointer;min-width:0;box-shadow:inset 0 -3px 0 var(--line)}
.wall.small .cell{padding:2px 1px 0;gap:0;box-shadow:inset 0 -1px 0 var(--line)}
.cell .lbl{position:absolute;top:3px;left:4px;font-family:var(--font-code);font-size:.68rem;color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:0 3px;border-radius:3px;z-index:1}
.wall.small .cell .lbl{display:none}
.cell.cubby{background:var(--maple-soft);box-shadow:inset 0 0 0 3px var(--maple)}
.cell.empty{cursor:default;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
.cell.hl{box-shadow:inset 0 0 0 3px var(--glow);animation:pulse 1.6s ease-in-out 3}
.cell.dim{opacity:.45}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--glow)}}
.mini{min-width:0;border-radius:1px 1px 0 0}
.mini-stack{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:0;min-width:0;margin-right:2px}
.mini-stack i{display:block;height:3px;border-radius:1px}
.wall.small .mini-stack i{height:1.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.soon{display:flex;gap:12px;align-items:center}
.soon .ph{width:56px;height:56px;border-radius:6px;border:2px dashed var(--line);flex-shrink:0;display:grid;place-items:center;font-family:var(--font-code);color:var(--muted)}

/* ---------- shelf view ---------- */
.back{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.shelfhead{display:flex;gap:14px;align-items:center;justify-content:space-between}
.shelfhead .big{font-family:var(--font-code);font-size:2.4rem;line-height:1;color:var(--ink)}
.board{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px var(--shelf-shadow);overflow:hidden}
.board.cubbyboard{background:var(--maple-soft);border-color:var(--maple)}
.scroller{overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:smooth;padding:14px 14px 0}
.layers{display:flex;flex-direction:column;justify-content:flex-end;min-width:max-content}
.toplayer{display:flex;align-items:flex-end;gap:14px;padding-left:4px}
.rowlayer{display:flex;align-items:flex-end;gap:2px;min-height:120px}
.ledge{height:12px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 0 var(--line) inset}
.board.cubbyboard .ledge{background:var(--maple)}
.spine{position:relative;flex:0 0 auto;border:0;border-radius:3px 3px 1px 1px;padding:8px 0;cursor:pointer;display:flex;justify-content:center;overflow:hidden;box-shadow:inset 2px 0 0 rgba(255,255,255,.12),inset -2px 0 0 rgba(0,0,0,.14);transition:transform .15s}
.spine:hover{transform:translateY(-4px)}
.spine span{writing-mode:vertical-rl;font-size:11px;line-height:1.1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine.lean{transform:rotate(-4deg);transform-origin:bottom left}
.flat{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end}
.flat .spine{padding:0 8px;align-items:center;justify-content:flex-start;border-radius:2px}
.flat .spine span{writing-mode:horizontal-tb}
.flat .spine:hover{transform:translateX(4px)}
.pilecap{font-size:.68rem;color:var(--muted);margin-bottom:3px}
.spine.focus{outline:3px solid var(--glow);outline-offset:2px;animation:lift 1.8s ease-in-out 3;z-index:2}
@keyframes lift{50%{transform:translateY(-10px)}}
.flat .spine.focus{animation:slide 1.8s ease-in-out 3}
@keyframes slide{50%{transform:translateX(12px)}}
.spine.status-reading::after,.spine.status-borrowed::after{content:"";position:absolute;top:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.flat .spine.status-reading::after,.flat .spine.status-borrowed::after{left:auto;right:6px;top:50%;margin-top:-3.5px}
.where{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--glow)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item .chip-col{width:10px;height:38px;border-radius:2px}
.item .t{font-weight:600;line-height:1.25;min-width:0}
.item .a{font-size:.85rem;color:var(--muted)}
.item .loc{font-family:var(--font-code);font-size:.78rem;padding:3px 7px;border-radius:6px;background:var(--bg);white-space:nowrap}
.item .badge{font-size:.72rem;font-weight:600;color:var(--warn)}
.item:hover{background:var(--bg)}

/* ---------- find ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;min-width:0;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fgroup{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.maple{background:var(--maple);color:#1d1307;border-color:var(--maple)}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.count{font-size:.85rem;color:var(--muted)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:calc(92% - env(safe-area-inset-top,0px));overflow-y:auto;border-radius:18px 18px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.cover{width:74px;height:108px;border-radius:3px 6px 6px 3px;box-shadow:0 4px 12px var(--shelf-shadow),inset 6px 0 0 rgba(0,0,0,.18);display:flex;align-items:flex-end;padding:7px;font-family:var(--font-display);font-size:.72rem;line-height:1.1;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.75rem;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--ink)}
.desc{margin:14px 0 0;max-width:65ch}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-variant-numeric:tabular-nums;font-size:1.05rem}
.kv small{color:var(--muted);font-size:.72rem}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:var(--glow)}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.9rem}
.note small{color:var(--muted);display:block}
textarea,input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flagnote{background:var(--maple-soft);border-radius:8px;padding:8px 10px;font-size:.85rem}
.rtl{direction:rtl;unicode-bidi:plaintext}

/* ---------- family ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:.84rem}
.bar .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:420px){.bar{grid-template-columns:118px 1fr 30px}}
.people{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{display:flex;width:100%;max-width:520px;justify-content:space-around}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;padding:6px 14px;border-radius:10px;cursor:pointer;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

function allBooks(){
  const list = [];
  for (const b of CATALOG) list.push(merge(b));
  for (const [id,a] of Object.entries(S.added)) list.push(merge({...a,id,added:true}));
  return list.filter(b => !b.removed);
}
function merge(b){
  const st = S.bookState[b.id] || {};
  const m = {...b, ...(st.edit||{})};
  if (st.move){ m.spot = st.move.spot; m.pos = st.move.pos; m.group = ""; }
  m.removed = !!st.removed;
  m.st = st;
  return m;
}
const byId = id => allBooks().find(b => b.id === id);
const unknown = b => b.title.startsWith("(");

/* layer: 'row' | 'stack' | 'top' with pile names */
function layerOf(b){
  const g = (b.group||"").toLowerCase();
  if (g.startsWith("stack")) return {layer:"stack", pile:b.group};
  if (g.startsWith("lying on top")) return {layer:"top", pile:(b.group.split(",")[1]||"").trim() || "on top"};
  return {layer:"row"};
}
function shelfBooks(spot){
  return allBooks().filter(b => b.spot === spot).sort((a,b) => a.pos - b.pos);
}
function shelfStructure(spot){
  const books = shelfBooks(spot);
  const stacks = [], tops = [], row = [];
  const pileMap = {};
  for (const b of books){
    const L = layerOf(b);
    if (L.layer === "row") row.push(b);
    else {
      const key = L.layer + "|" + L.pile;
      if (!pileMap[key]){ pileMap[key] = {name:L.pile, books:[]}; (L.layer==="stack"?stacks:tops).push(pileMap[key]); }
      pileMap[key].books.push(b);
    }
  }
  return {books, stacks, tops, row};
}
const ord = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");
function locate(b){
  const s = shelfStructure(b.spot);
  for (const p of [...s.stacks, ...s.tops]){
    const i = p.books.findIndex(x => x.id === b.id);
    if (i >= 0){
      const pileLabel = p.name.startsWith("stack") ? (s.stacks.indexOf(p)===0 ? "left pile" : "right pile") : p.name.replace(/pile$/,"pile");
      return (s.tops.includes(p) ? "Lying on top, " : "") + `${ord(i+1)} from the top of the ${pileLabel}`;
    }
  }
  const i = s.row.findIndex(x => x.id === b.id);
  const n = s.row.length;
  if (i < 0) return "";
  return i < n/2 ? `${ord(i+1)} from the left` : (n-i===1 ? "Last on the right" : `${ord(n-i)} from the right`);
}

/* Firestore layout: libraries/{familyCode}/state/{bookId}, .../added/{id}, .../meta/family.
   Security rules only allow paths whose {familyCode} matches the real code. */
const FB_VERSION = "10.12.2";
const FB = {};          // loaded Firebase functions
S.code = store.get("fs-code", null);
S.online = navigator.onLine;
S.pendingWrites = 0;
const base = () => "libraries/" + S.code;

async function loadFirebase(){
  if (FB.ready) return;
  const app = await import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app.js`);
  const fs  = await import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore.js`);
  Object.assign(FB, fs);
  const fbApp = app.initializeApp(FIREBASE_CONFIG);
  try{
    FB.db = fs.initializeFirestore(fbApp, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})});
  }catch(e){
    FB.db = fs.getFirestore(fbApp);   // private browsing: falls back to memory cache
  }
  FB.ready = true;
}
async function checkCode(code){
  // true = correct, false = wrong, null = could not check (offline)
  await loadFirebase();
  try{
    await FB.getDocFromServer(FB.doc(FB.db, "libraries", code, "meta", "family"));
    return true;
  }catch(e){
    if (e && e.code === "permission-denied") return false;
    return null;
  }
}
async function initDb(){
  if (!S.code){ render(); return; }
  try{ await loadFirebase(); }
  catch(e){ S.dbFailed = true; S.offlineStart = true; render(); return; }
  S.db = FB.db;
  const onErr = name => e => {
    console.warn(name, e);
    if (e && e.code === "permission-denied"){ store.set("fs-code", null); S.code = null; S.codeError = "That family code no longer works. Enter the current one."; render(); }
  };
  FB.onSnapshot(FB.collection(FB.db, base(), "state"), {includeMetadataChanges:true}, snap => {
    const m = {}; snap.forEach(d => { m[d.id] = d.data(); });
    S.bookState = m; S.dbReady = true; S.fromCache = snap.metadata.fromCache; S.pendingWrites = snap.metadata.hasPendingWrites ? 1 : 0; render();
  }, onErr("state"));
  FB.onSnapshot(FB.collection(FB.db, base(), "added"), snap => {
    const m = {}; snap.forEach(d => { m[d.id] = d.data(); }); S.added = m; render();
  }, onErr("added"));
  FB.onSnapshot(FB.doc(FB.db, base(), "meta", "family"), snap => {
    const d = snap.exists() ? snap.data() : null; S.family = (d && Array.isArray(d.names)) ? d.names : S.family; render();
  }, onErr("family"));
}
function writeDoc(path, data){
  if (!S.db) return Promise.resolve();
  // setDoc resolves when the server confirms; offline it stays pending and syncs later,
  // so we never block the interface on it.
  const p = FB.setDoc(FB.doc(FB.db, path), data);
  p.catch(e => {
    if (e && e.code === "permission-denied") toast("This phone isn't allowed to save. Check the family code.");
    else toast("Couldn't save that change. It will retry when you're back online.");
  });
  return p;
}
function patchBook(id, fn){
  const cur = JSON.parse(JSON.stringify(S.bookState[id] || {}));
  const next = fn(cur) || cur;
  S.bookState = {...S.bookState, [id]: next};
  render();
  const prev = writeChains[id] || Promise.resolve();
  writeChains[id] = prev.then(() => writeDoc(base() + "/state/" + id, next)).catch(() => {});
  return writeChains[id];
}
async function saveFamily(names){
  S.family = names; render();
  writeDoc(base() + "/meta/family", {names});
}
async function saveAdded(id, data){
  S.added = {...S.added, [id]: data}; render();
  writeDoc(base() + "/added/" + id, data);
}
window.addEventListener("online", () => { S.online = true; render(); });
window.addEventListener("offline", () => { S.online = false; render(); });

document.addEventListener("submit", async e => {
  if (e.target.id !== "gateform") return;
  e.preventDefault();
  const code = (document.getElementById("code").value || "").trim();
  if (!code){ S.codeError = "Type the family code first."; render(); return; }
  if (!/^[A-Za-z0-9_\-.~]{3,60}$/.test(code)){ S.codeError = "The code can use letters, numbers, dashes and dots, with no spaces."; render(); return; }
  S.checking = true; S.codeError = ""; render();
  let ok;
  try{ ok = await checkCode(code); }catch(err){ ok = null; }
  S.checking = false;
  if (ok === false){ S.codeError = "That code isn't right. Check with whoever set up the library."; render(); return; }
  if (ok === null){ S.codeError = "Couldn't check the code. Make sure you're online, then try again."; render(); return; }
  S.code = code; store.set("fs-code", code); render(); initDb();
});

/* ---------------- helpers ---------------- */
function lum(hex){
  const h = hex.replace("#",""); const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)/255;
}
const inkOn = c => lum(c||"#888") > .6 ? "#1c1c1c" : "#f7f5f0";
function dims(b){
  const p = b.pages || 220;
  const h = {th:148,pb:168,mg:158,hc:192,lg:226}[b.size] || 168;
  let w;
  if (b.size === "th") w = 9 + Math.min(p,120)/30;
  else if (b.size === "mg") w = 9;
  else if (b.size === "lg") w = Math.max(16, Math.min(40, p/12));
  else w = Math.max(13, Math.min(46, 8 + p/22));
  return {h, w:Math.round(w)};
}
function flatDims(b){
  const d = dims(b);
  return {w: {lg:210,hc:172,pb:150,th:140,mg:150}[b.size] || 150, h: Math.max(9, Math.min(28, d.w*0.75))};
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function needMe(then){
  if (S.me) return then();
  openPicker(then);
}

/* ---------------- rendering: wall map ---------------- */
const AREAS = {
  A1:"1/1/2/2", A2:"2/1/3/2", A3:"3/1/4/2", "A-cubby":"4/1/5/3", A4:"5/1/6/2", A5:"6/1/7/2",
  B1:"1/2/2/4", B2:"2/2/3/4", B3:"3/2/4/4", B4:"4/3/5/4", B5:"5/2/6/4", B6:"6/2/7/4"
};
function miniCell(spot, small, hl){
  if (spot === "B6") return `<div class="cell empty" style="grid-area:${AREAS[spot]}">${small?"":"cushions"}</div>`;
  const s = shelfStructure(spot);
  const H = {lg:100, hc:86, pb:76, mg:72, th:70};
  const barH = small ? 1.5 : 3;
  let inner = "";
  // flat piles: each pile takes room in proportion to its widest book; bars keep their relative lengths
  for (const p of s.stacks.concat(s.tops)){
    const wmax = Math.max(...p.books.map(b => flatDims(b).w));
    inner += `<span class="mini-stack" style="flex:${(wmax/9).toFixed(1)} 1 0">${p.books.map(b => `<i style="background:${b.color};width:${Math.round(flatDims(b).w/wmax*100)}%;height:${barH}px"></i>`).join("")}</span>`;
  }
  // upright spines: widths share the shelf in proportion to thickness, heights follow the format
  inner += s.row.map(b => { const d = dims(b); return `<span class="mini" style="flex:${d.w} 1 0;background:${b.color};height:${H[b.size]||76}%"></span>`; }).join("");
  const cls = ["cell", spot==="A-cubby"?"cubby":"", hl===spot?"hl":"", hl && hl!==spot && small ? "dim":""].join(" ");
  return `<button class="${cls}" style="grid-area:${AREAS[spot]}" data-shelf="${spot}" aria-label="Shelf ${spot}, ${s.books.length} books"><span class="lbl">${spot==="A-cubby"?"cubby":spot}</span>${inner}</button>`;
}
function wallMap(small, hl){
  return `<div class="wall${small?" small":""}" aria-label="Wall 1 map">${[...SHELF_ORDER,"B6"].map(s => miniCell(s, small, hl)).join("")}</div>`;
}

  <div class="board${spot==="A-cubby"?" cubbyboard":""}"><div class="scroller" id="scroller"><div class="layers">

}

/* ---------------- find ---------------- */
function filtered(){
  const q = S.q.trim().toLowerCase(); const f = S.f;
  let list = allBooks().filter(b => {
    if (q && !(`${b.title} ${b.author} ${b.desc} ${b.genre}`.toLowerCase().includes(q))) return false;
    if (f.genres.length && !f.genres.includes(b.genre)) return false;
    if (f.langs.length && !f.langs.includes(b.lang)) return false;
    if (f.moods.length && !f.moods.every(m => (b.tags||[]).includes(m))) return false;
    if (f.shelf && b.spot !== f.shelf) return false;
    if (f.length){ const p = b.pages||0; if (!p) return false; if (f.length==="short" && p>=200) return false; if (f.length==="medium" && (p<200||p>400)) return false; if (f.length==="long" && p<=400) return false; }
    const st = statusOf(b);
    if (f.status==="unread-me" && (!S.me || st.reads[S.me])) return false;
    if (f.status==="read-me" && (!S.me || !st.reads[S.me])) return false;
    if (f.status==="read-any" && !Object.keys(st.reads).length) return false;
    if (f.status==="unread-all" && Object.keys(st.reads).length) return false;
    if (f.status==="reading" && !st.reading) return false;
    if (f.status==="out" && !(st.borrowed||st.lent)) return false;
    if (f.status==="check" && !(b.flag || unknown(b))) return false;
    return true;
  });
  const key = {title:b=>b.title.toLowerCase(), author:b=>(b.author||"zzz").toLowerCase(), year:b=>b.year||9999, shelf:b=>SHELF_ORDER.indexOf(b.spot)*1000+b.pos}[f.sort] || (b=>0);
  return list.sort((a,b) => { const x=key(a), y=key(b); return x<y?-1:x>y?1:0; });
}
function chipRow(field, options, multi){
  return `<div class="chips">${Object.entries(options).map(([k,v]) => {
    const on = multi ? S.f[field].includes(k) : S.f[field]===k;
    return `<button class="chip" aria-pressed="${on}" data-filter="${field}" data-val="${esc(k)}" data-multi="${multi?1:0}">${esc(v)}</button>`;
  }).join("")}</div>`;
}

    <div class="fgroup"><div class="eyebrow">Shelf</div>${chipRow("shelf", Object.fromEntries(SHELF_ORDER.map(s=>[s,s==="A-cubby"?"Cubby":s])), false)}</div>
    <div class="row" style="justify-content:space-between"><span class="count">${res.length} of ${books.length} books</span>
      <span class="row">${active?`<button class="btn small" data-act="clear">Clear filters</button>`:""}
      <select id="sort" aria-label="Sort" style="width:auto;padding:6px 8px">${[["shelf","Shelf order"],["title","Title"],["author","Author"],["year","Year"]].map(([k,v])=>`<option value="${k}" ${S.f.sort===k?"selected":""}>${v}</option>`).join("")}</select></span></div>
    ${res.length ? `<div class="list">${res.slice(0,250).map(itemRow).join("")}</div>${res.length>250?`<div class="count">Showing the first 250. Narrow the filters to see the rest.</div>`:""}` : `<div class="card muted">No books match. Try removing a filter.</div>`}
  </div>`;

function pickForMe(){
  let pool = filtered().filter(b => !unknown(b) && b.genre!=="Other" && !(S.me && statusOf(b).reads[S.me]) && !b.tags.includes("reference"));
  if (!pool.length) pool = allBooks().filter(b => !unknown(b));
  const b = pool[Math.floor(Math.random()*pool.length)];
  if (b) openSheet(b.id);
}

/* ---------------- sheet ---------------- */
function openSheet(id, mode){ S.sheet = id; S.sheetMode = mode||"view"; renderSheet(); }
function closeSheet(){ S.sheet = null; document.getElementById("layer").innerHTML = ""; }
function renderSheet(){
  const L = document.getElementById("layer");
  if (S.sheet === "__picker") return renderPicker();
  if (S.sheet === "__add") return renderAdd();
  if (!S.sheet){ L.innerHTML=""; return; }
  const b = byId(S.sheet); if (!b){ closeSheet(); return; }
  const st = statusOf(b);
  const me = S.me;
  const myRating = me ? (st.ratings[me]||0) : 0;
  const others = Object.entries(st.ratings).filter(([n])=>n!==me);
  const readers = Object.entries(st.reads);
  const meta = [b.genre, LANGS[b.lang]||"", b.year ? (b.year<0? `${-b.year} BC` : b.year) : "", b.pages ? `~${b.pages} pages` : "", ...(b.tags||[]).map(t=>MOODS[t]||t)].filter(Boolean);

  const rtl = isAr(b.title);

    <div class="grab"></div>

        st.lent?`<div class="row"><span>Lent to ${esc(st.lent)}.</span><button class="btn small" data-act="return">Back on the shelf</button></div>`:
        `<div class="row"><button class="btn small" data-act="borrow">I'm taking it</button></div>
         <div class="row" style="flex-wrap:nowrap"><input type="text" id="lendto" placeholder="Lend to someone outside the family" aria-label="Lend to"><button class="btn small" data-act="lend">Lend</button></div>`}
    </div>
    <div class="section">
      <div class="eyebrow">Notes</div>
      ${st.notes.map(n=>`<div class="note">${esc(n.text)}<small>${esc(n.by)}, ${esc(n.at)}</small></div>`).join("")}
      <textarea id="note" placeholder="Add a note, a favourite line, or who recommended it" aria-label="New note"></textarea>
      <div><button class="btn small" data-act="note">Add note</button></div>
    </div>
    <div class="section">
      <div class="eyebrow">Estimated value</div>
      <div class="kv"><div><b>${usd(b.price||0)}</b><small>new today</small></div><div><b>${usd(b.orig||0)}</b><small>cover price then</small></div><div><b>${usd(b.resale||0)}</b><small>resale used</small></div></div>
    </div>
    <div class="section"><div class="row"><button class="btn small" data-act="edit">Edit details or move</button><button class="btn small" data-act="close">Close</button></div></div>`}
  </div></div>`;
}
function editForm(b){
  return `<div class="section"><div class="eyebrow">Edit details</div>
    <label class="f">Title<input type="text" id="e-title" value="${esc(b.title)}"></label>
    <label class="f">Author<input type="text" id="e-author" value="${esc(b.author)}"></label>
    <div class="grid2"><label class="f">Genre<select id="e-genre">${[...new Set(allBooks().map(x=>x.genre))].sort().map(g=>`<option ${g===b.genre?"selected":""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f">Language<select id="e-lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===b.lang?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <label class="f">Description<textarea id="e-desc">${esc(b.desc)}</textarea></label>
    <div class="eyebrow" style="margin-top:6px">Move it</div>
    <div class="grid2"><label class="f">Shelf<select id="e-spot">${SHELF_ORDER.map(s=>`<option ${s===b.spot?"selected":""}>${s}</option>`).join("")}</select></label>
    <label class="f">Position from the left<input type="number" id="e-pos" min="1" value="${shelfStructure(b.spot).row.findIndex(x=>x.id===b.id)+1 || 1}"></label></div>
    <div class="row"><button class="btn primary" data-act="saveedit">Save</button><button class="btn" data-act="canceledit">Cancel</button><button class="btn" style="color:var(--warn);margin-left:auto" data-act="remove">Remove from library</button></div>
    <div id="rmconfirm"></div></div>`;
}
function renderPicker(){
  const L = document.getElementById("layer");
  L.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Who is using the app">
    <div class="grab"></div><h2>Who's using the app?</h2>
    <p class="muted" style="margin:6px 0 12px">Your name goes on the books you read, rate, borrow or add notes to. This phone remembers it.</p>
    <div class="people">${S.family.map(n=>`<button class="chip" aria-pressed="${S.me===n}" data-me="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px;flex-wrap:nowrap"><input type="text" id="newname" placeholder="Add a name" aria-label="Your name"><button class="btn primary" data-act="addname">Add</button></div>
  </div></div>`;
}
function openPicker(then){ S.after = then || null; S.returnTo = (S.sheet && !String(S.sheet).startsWith("__")) ? S.sheet : null; S.sheet = "__picker"; renderSheet(); }
function finishPicker(){
  const after = S.after, back = S.returnTo; S.after = null; S.returnTo = null;
  if (back){ S.sheet = back; S.sheetMode = "view"; } else { S.sheet = null; document.getElementById("layer").innerHTML = ""; }
  render(); if (back) renderSheet();
  if (after) after();
}
function renderAdd(){
  const L = document.getElementById("layer");
  L.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add a book">
    <div class="grab"></div><h2>Add a book</h2>
    <div class="stack-v" style="margin-top:12px">
    <label class="f">Title<input type="text" id="a-title"></label>
    <label class="f">Author<input type="text" id="a-author"></label>
    <div class="grid2"><label class="f">Genre<select id="a-genre">${[...new Set(allBooks().map(x=>x.genre))].sort().map(g=>`<option>${esc(g)}</option>`).join("")}</select></label>
    <label class="f">Language<select id="a-lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label></div>
    <div class="grid2"><label class="f">Shelf<select id="a-spot">${SHELF_ORDER.map(s=>`<option>${s}</option>`).join("")}</select></label>
    <label class="f">Position from the left<input type="number" id="a-pos" min="1" placeholder="End of shelf"></label></div>
    <div class="grid2"><label class="f">Pages (roughly)<input type="number" id="a-pages" min="1"></label>
    <label class="f">Format<select id="a-size"><option value="pb">Paperback</option><option value="hc">Hardcover</option><option value="lg">Large / coffee-table</option><option value="th">Thin</option></select></label></div>
    <label class="f">Description (optional)<textarea id="a-desc"></textarea></label>
    <div class="row"><button class="btn primary" data-act="saveadd">Add to the shelf</button><button class="btn" data-act="close">Cancel</button></div>
    </div></div></div>`;
}
function posForIndex(spot, idx, exceptId){
  const row = shelfStructure(spot).row.filter(b=>b.id!==exceptId);
  if (!row.length) return 1;
  if (!idx || idx > row.length) return row[row.length-1].pos + 1;
  if (idx <= 1) return row[0].pos - 1;
  return (row[idx-2].pos + row[idx-1].pos)/2;
}
const PALETTE = ["#2f6f6a","#7a2433","#1f4fa8","#c9a3a3","#e9c95a","#3b6b3a","#5a2a4a","#d8742a","#1d1d1d","#efe9db","#2a8fbf","#8a7a3a"];

/* ---------------- main render ---------------- */
function syncBanner(){
  if (!S.online) return `<div class="syncchip"><i></i>Offline. Your changes are saved on this phone and will sync when you're back online.</div>`;
  if (S.offlineStart) return `<div class="banner">The library couldn't connect. You can still browse; reload when you're online to see the family's changes.</div>`;
  return "";
}
let lastTab = null;
function render(){
  const app = document.getElementById("app");
  const scrollX = document.getElementById("scroller")?.scrollLeft;
  const qFocused = document.activeElement && document.activeElement.id === "q";
  const caret = qFocused ? document.activeElement.selectionStart : null;
  const gated = !S.code;
  document.querySelector(".tabs").hidden = gated;
  if (gated){ const typed = document.getElementById("code")?.value || ""; app.innerHTML = viewGate(); const c=document.getElementById("code"); if (c){ c.value = typed; } return; }
  app.innerHTML = S.tab==="find" ? viewFind() : S.tab==="family" ? viewFamily() : viewShelves();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab===S.tab ? "page" : "false"));
  if (qFocused){ const q = document.getElementById("q"); q.focus(); try{ q.setSelectionRange(caret,caret); }catch(e){} }
  const sc = document.getElementById("scroller");
  if (sc){
    if (S.pendingScroll){
      S.pendingScroll = false;
      const el = sc.querySelector(".spine.focus");
      if (el){ sc.style.scrollBehavior="auto"; sc.scrollLeft = Math.max(0, el.offsetLeft - sc.clientWidth/2 + el.offsetWidth/2); sc.style.scrollBehavior=""; }
    } else if (scrollX != null) { sc.style.scrollBehavior="auto"; sc.scrollLeft = scrollX; sc.style.scrollBehavior=""; }
  }
  if (S.sheet && S.sheet !== "__picker" && S.sheet !== "__add" && S.sheetMode !== "edit"){
    const active = document.activeElement && document.activeElement.closest(".sheet");
    if (!active || !["note","lendto"].includes(document.activeElement.id)) renderSheet();
  }
  lastTab = S.tab;
}
function go(tab){ S.tab = tab; if (tab!=="shelves"){ S.focus=null; } window.scrollTo(0,0); render(); }

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest(".tab"); if (tab){ if (tab.dataset.tab==="shelves" && S.tab==="shelves"){ S.shelf=null; S.focus=null; } go(tab.dataset.tab); return; }
  const scrim = t.closest(".scrim");
  if (scrim && t === scrim){ if (S.sheet==="__picker" && S.returnTo){ S.after=null; finishPicker(); } else closeSheet(); return; }
  const actEl = t.closest("[data-act]"); const act = actEl && actEl.dataset.act;
  const meEl = t.closest("[data-me]");
  if (meEl){ S.me = meEl.dataset.me; store.set("fs-me", S.me); if (S.sheet==="__picker") finishPicker(); else render(); return; }
  const shelfEl = t.closest("[data-shelf]");
  if (shelfEl && !t.closest(".wall.small") || (shelfEl && t.closest(".wall.small"))){ S.shelf = shelfEl.dataset.shelf; S.focus=null; S.tab="shelves"; window.scrollTo(0,0); render(); return; }
  const bookEl = t.closest("[data-book]");
  if (bookEl && !t.closest(".sheet")){ openSheet(bookEl.dataset.book); return; }
  const rate = t.closest("[data-rate]");
  if (rate){ const n = +rate.dataset.rate; needMe(() => patchBook(S.sheet, s => { s.ratings = {...(s.ratings||{})}; if (s.ratings[S.me]===n) delete s.ratings[S.me]; else s.ratings[S.me]=n; return s; })); return; }
  const fEl = t.closest("[data-filter]");
  if (fEl){ const k=fEl.dataset.filter, v=fEl.dataset.val; if (fEl.dataset.multi==="1"){ const a=S.f[k]; S.f[k] = a.includes(v)?a.filter(x=>x!==v):[...a,v]; } else S.f[k] = S.f[k]===v?"":v;
    if ((v==="unread-me"||v==="read-me") && !S.me && S.f[k]) { openPicker(); }
    store.set("fs-f", S.f); render(); return; }
  if (!act) return;
  const id = S.sheet;
  switch(act){
    case "close": closeSheet(); break;
    case "wall": S.shelf=null; S.focus=null; render(); break;
    case "picker": openPicker(); break;
    case "pick": pickForMe(); break;
    case "clear": S.q=""; S.f={genres:[],langs:[],moods:[],status:"",length:"",shelf:"",sort:S.f.sort}; store.set("fs-f",S.f); store.set("fs-q",""); render(); break;
    case "needcheck": S.q=""; S.f={genres:[],langs:[],moods:[],status:"check",length:"",shelf:"",sort:"shelf"}; go("find"); break;
    case "add": S.sheet="__add"; renderSheet(); break;
    case "show": { const b = byId(actEl.dataset.id); closeSheet(); S.tab="shelves"; S.shelf=b.spot; S.focus=b.id; S.pendingScroll=true; window.scrollTo(0,0); render(); break; }
    case "reading": needMe(() => patchBook(id, s => { if (s.readingBy===S.me){ delete s.readingBy; } else { s.readingBy=S.me; } return s; })); break;
    case "read": needMe(() => patchBook(id, s => { s.reads={...(s.reads||{})}; if (s.reads[S.me]) delete s.reads[S.me]; else { s.reads[S.me]=today(); s.lastRead={by:S.me,at:today()}; if (s.readingBy===S.me) delete s.readingBy; } return s; })); break;
    case "borrow": needMe(() => patchBook(id, s => { s.borrowedBy=S.me; return s; })); break;
    case "lend": { const v=(document.getElementById("lendto").value||"").trim(); if(!v){ toast("Type who you're lending it to."); break; } needMe(() => patchBook(id, s => { s.lentTo=v; s.lentBy=S.me; return s; })); break; }
    case "return": patchBook(id, s => { delete s.borrowedBy; delete s.lentTo; delete s.lentBy; return s; }); toast("Marked as back on the shelf"); break;
    case "note": { const v=(document.getElementById("note").value||"").trim(); if(!v){ toast("Write something first."); break; } needMe(() => { patchBook(id, s => { s.notes=[...(s.notes||[]), {by:S.me,at:today(),text:v.slice(0,1000)}]; return s; }); const n=document.getElementById("note"); if(n) n.value=""; renderSheet(); }); break; }
    case "edit": S.sheetMode="edit"; renderSheet(); break;
    case "canceledit": S.sheetMode="view"; renderSheet(); break;
    case "saveedit": {
      const b = byId(id); const val = k => document.getElementById(k).value;
      const edit = {title:val("e-title").trim()||b.title, author:val("e-author").trim(), genre:val("e-genre"), lang:val("e-lang"), desc:val("e-desc").trim()};
      const spot = val("e-spot"); const idx = parseInt(val("e-pos"),10);
      const curIdx = shelfStructure(b.spot).row.findIndex(x=>x.id===b.id)+1;
      const moved = spot!==b.spot || (idx && idx!==curIdx);
      const pos = moved ? posForIndex(spot, idx, b.id) : null;
      if (b.added){ const a = {...S.added[id], ...edit}; if (moved){ a.spot=spot; a.pos=pos; } saveAdded(id, a); }
      else patchBook(id, s => { s.edit = {...(s.edit||{}), ...edit, flag:""}; if (moved) s.move={spot,pos}; return s; });
      S.sheetMode="view"; toast(moved?`Moved to ${spot}`:"Saved"); renderSheet(); break; }
    case "remove": document.getElementById("rmconfirm").innerHTML = `<div class="flagnote row" style="margin-top:8px">Remove this book from the app? <button class="btn small" data-act="rmyes">Yes, remove</button></div>`; break;
    case "rmyes": { const b=byId(id); if (b.added){ const a={...S.added[id], removed:true}; saveAdded(id,a); } else patchBook(id, s => { s.removed=true; return s; }); closeSheet(); toast("Removed"); break; }
    case "addname": { const v=(document.getElementById("newname").value||"").trim().slice(0,30); if(!v) break; if(!S.family.includes(v)) saveFamily([...S.family, v]); S.me=v; store.set("fs-me",v); finishPicker(); break; }
    case "saveadd": {
      const val = k => document.getElementById(k).value;
      const title = val("a-title").trim(); if(!title){ toast("Add a title first."); break; }
      const spot = val("a-spot"); const nid = "new-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const data = {title, author:val("a-author").trim(), genre:val("a-genre"), lang:val("a-lang"), spot, pos:posForIndex(spot, parseInt(val("a-pos"),10)),
        pages:parseInt(val("a-pages"),10)||null, size:val("a-size"), desc:val("a-desc").trim(), color:PALETTE[Math.floor(Math.random()*PALETTE.length)],
        tags:[], year:null, group:"", flag:"", price:0, orig:0, resale:0, addedBy:S.me||"", addedAt:today()};
      saveAdded(nid, data); closeSheet(); toast(`Added to ${spot}`); S.tab="shelves"; S.shelf=spot; S.focus=nid; S.pendingScroll=true; render(); break; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ S.q = e.target.value; store.set("fs-q", S.q); clearTimeout(S.qt); S.qt = setTimeout(render, 120); }
});
document.addEventListener("change", e => { if (e.target.id === "sort"){ S.f.sort = e.target.value; store.set("fs-f", S.f); render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });

render();
initDb();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>

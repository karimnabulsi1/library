<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Log</title>
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a stadium scoreboard. Near-black board, amber numerals as the only loud thing,
   condensed uppercase labels, a spotter bear in the header. One committed dark world. */
:root{
  --bg:#0e0d0b; --on-bg:#e9e4d8; --bg-muted:#8b8472;
  --surface:#171512; --field:#0e0d0b; --paper:#24211b; --ink:#e9e4d8; --muted:#8b8472; --line:#2e2a22;
  --accent:#ffb21f; --accent-ink:#1a1200; --marigold:#ffb21f; --dim:#8a6012; --danger:#ff7a66;
  --display:"Big Shoulders Display","Big Shoulders","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--on-bg);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:84px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.wrap>*,#app>*{min-width:0}
#app{width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.03em;text-transform:uppercase;line-height:.95;margin:0;white-space:nowrap}
.brand em{font-style:normal;color:var(--accent)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="saved"]::before{background:var(--accent)}
.sync[data-s="error"]::before{background:var(--danger)}
.bear{display:flex;align-items:flex-end;gap:6px;min-width:0}
.bear svg{flex:none}
.bubble{background:var(--paper);color:var(--ink);border-radius:12px 12px 2px 12px;padding:7px 10px;font-size:13px;line-height:1.25;max-width:175px;margin-bottom:10px}
h2{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-family:var(--display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:0;background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:46px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em}
.btn:active{filter:brightness(1.25)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:22px;font-weight:900;min-height:56px}
.btn.ghost{background:transparent;color:var(--muted);padding:10px 8px}
.btn.danger{color:var(--danger)}
.link{border:0;background:transparent;padding:0;color:var(--accent);font-size:13px;font-weight:500;text-align:left}
.icon{border:0;background:transparent;color:var(--muted);width:34px;height:36px;border-radius:8px;font-size:19px;line-height:1}
.icon:active{background:var(--paper)}
.tag{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:2px 8px;white-space:nowrap}
.lv{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--dim);border-radius:4px;padding:1px 6px;white-space:nowrap}
.xp{display:inline-flex;gap:2px;vertical-align:middle}
.xp i{width:12px;height:6px;background:var(--line);display:block}
.xp i.on{background:var(--accent)}
/* week lamps */
.weekbox{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted)}
.day i{width:100%;height:14px;border-radius:3px;background:var(--paper);display:block}
.day.on i{background:var(--accent)}
.day.today{color:var(--on-bg)}
.day.today:not(.on) i{box-shadow:inset 0 0 0 1.5px var(--dim)}
/* muscle map */
.mm{display:flex;gap:10px;align-items:center}
.mm svg{flex:none}
.mm .grow{display:flex;flex-direction:column;gap:8px;font-size:13px}
.mm b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* workout */
.ex .last{margin:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.barbox{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px 8px;text-align:center}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:18px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:900;font-size:20px;color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;height:52px;position:relative}
.step button{border:0;background:transparent;height:100%;font-size:21px;color:var(--muted);padding:0}
.step input::placeholder{color:var(--danger);opacity:.8}
.step input{border:0;background:transparent;width:100%;min-width:0;text-align:center;font-family:var(--display);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;padding:0 0 10px;height:100%;color:var(--accent)}
.step input:focus{outline:none}
.step:focus-within{border-color:var(--accent)}
.step .u{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.tick{width:48px;height:52px;border-radius:8px;border:2px solid var(--line);background:transparent;font-size:22px;font-weight:700;color:transparent}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done .step input{color:var(--ink)}
.fail{grid-column:3;justify-self:center;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 12px;min-height:30px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.fail[aria-pressed="true"]{border:1px solid var(--danger);color:var(--danger);background:rgba(255,122,102,.08)}
.pr{grid-column:2 / -1;justify-self:start;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 8px}
.text{-webkit-appearance:none;appearance:none}
select.text{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.note,.text{width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:10px 12px;min-height:46px}
.note:focus,.text:focus{outline:none;border-color:var(--accent)}
.bar{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 0;margin:-10px 0;border-bottom:1px solid var(--line)}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
.num{font-family:var(--display);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;color:var(--accent)}
.num small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
.up{color:var(--accent);font-weight:500;font-size:13px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;position:relative}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
svg{display:block;max-width:100%}
.chart text{fill:var(--muted);font-family:var(--body);font-size:10px;font-variant-numeric:tabular-nums}
.chart .val{fill:var(--accent);font-family:var(--display);font-weight:900;font-size:18px}
.detail{font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.detail div{display:flex;justify-content:space-between;gap:12px}
.detail span:last-child{color:var(--muted);text-align:right}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
/* trophies */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}
.trophy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding-bottom:10px;border-bottom:3px solid var(--line);font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.trophy b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;color:var(--accent)}
.trophy.locked{color:var(--muted)} .trophy.locked b{color:var(--muted)}
/* nav + toast */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:transparent;padding:14px 2px 16px;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0;color:var(--muted);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap;overflow:hidden;position:relative}
nav .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-family:var(--body);font-size:10px;line-height:16px;padding:0 4px}
.ghost{display:flex;gap:10px;align-items:flex-start;background:var(--field);border:1px solid var(--dim);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.35}
.ghost svg{flex:none;margin-top:2px}
.win{color:var(--accent);font-weight:700}
.crowns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.crown{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.crown b{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.crown small{color:var(--muted)}
.crown.mine{border-color:var(--accent);background:rgba(255,178,31,.07)}
.respect{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;min-height:36px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.respect[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.h2h{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 4px;font-size:14px;color:var(--ink)}
.h2h.head{border-top:0;padding-top:0;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h2h.sel{background:var(--field);border-radius:6px}
.h2h small{color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:6px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:12px;line-height:1;padding:0;vertical-align:middle;flex:none;position:relative}
.ib::after{content:"";position:absolute;inset:-8px;clip-path:inset(0)}
.ib.new{border-color:var(--accent);color:var(--accent);animation:ibp 1.4s ease-in-out 3}
@keyframes ibp{0%,100%{box-shadow:0 0 0 0 rgba(255,178,31,.6)}50%{box-shadow:0 0 0 6px rgba(255,178,31,0)}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:21;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:shup .22s ease-out}
.sheet p{margin:0;line-height:1.5}
@keyframes shup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.profbtn{flex-direction:row;align-items:center;text-align:left;width:100%;padding:12px 14px;color:var(--ink);cursor:pointer}
.profbtn::before{display:none}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);min-height:64px}
.tpl b{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.tpl span{font-size:12px;color:var(--muted)}
.tpl:active{border-color:var(--accent)}
.tlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.tlegend span{display:inline-flex;align-items:center;gap:4px}
.tlift{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.tlift b{font-family:var(--display);font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.tcells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tcell{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.tcell.mine{border-color:var(--accent);background:rgba(255,178,31,.08)}
.tn{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv{font-size:11px;color:var(--muted);white-space:nowrap}
.gl{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.gl svg{flex:none;margin-top:1px}
@media (prefers-reduced-motion:reduce){.ib.new,.sheet{animation:none}}
.medal{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2e2a22,#151310);box-shadow:inset 0 0 0 3px var(--ring),0 3px 0 rgba(0,0,0,.4);line-height:1;flex:none}
.medal.locked{background:transparent;box-shadow:inset 0 0 0 2px #3a352b;color:#5a5446;font-family:var(--display);font-weight:900;border:2px dashed #3a352b}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ttile{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--ink);min-width:0}
.ttile b{font-family:var(--display);font-size:13px;letter-spacing:.01em;text-transform:uppercase;line-height:1.1;hyphens:auto;-webkit-hyphens:auto;max-width:100%}
.ttile small{font-size:11px;color:var(--muted);line-height:1.25}
.ttile.off .medal:not(.locked){filter:grayscale(1) brightness(.5)}
.ttile.off b{color:var(--muted)}
.ttile.shame{border-color:rgba(255,122,102,.5)}
.tprog{width:80%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.tprog i{display:block;height:100%;background:var(--accent)}
.rare{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 6px}
.rare.c{background:#2a2620;color:#c9c4b8}.rare.r{background:#3a2a06;color:#ffb21f}.rare.vr{background:#141c33;color:#9bb4ff}
.showcase{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.showcase div{display:flex;flex-direction:column;align-items:center;gap:6px}
.showcase b{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.03em}
.shamecard{border-color:rgba(255,122,102,.45)}
.spinwrap{display:flex;justify-content:center;perspective:600px;padding:6px 0}
.spinwrap .medal{animation:spinin 1.1s cubic-bezier(.2,.9,.3,1.2)}
@keyframes spinin{from{transform:rotateY(540deg) scale(.3);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
.tsheet{align-items:stretch;text-align:left}
.unlock{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.ulbox{position:relative;z-index:2;max-width:360px;width:100%;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:popin .35s ease-out}
.unlock.shame .ulbox{border-color:var(--danger)}
.ulbox p{margin:0;line-height:1.45}
.spinwrap.big .medal{animation-duration:1.5s;box-shadow:inset 0 0 0 4px var(--ring),0 0 40px rgba(255,178,31,.35)}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;z-index:1;pointer-events:none}
@media (prefers-reduced-motion:reduce){.spinwrap .medal,.ulbox{animation:none}}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#1d1a16;box-shadow:inset 0 0 0 2.5px var(--ring);line-height:1;flex:none}
.av.ghosty{opacity:.35;filter:grayscale(1)}
.hat{position:absolute;top:-38%;left:50%;transform:translateX(-50%) rotate(-12deg);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.duel .dvs{display:flex;align-items:center;justify-content:space-around;padding-top:10px}
.duel .dvs>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.vs{font-family:var(--display);font-weight:900;font-size:22px;color:var(--muted)}
.dbar{height:8px;border-radius:4px;background:#3a352b;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.ddays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-family:var(--display);font-size:12px;color:var(--muted)}
.ddays span{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:34px}
.ddays i{display:block;width:6px;border-radius:2px 2px 0 0;background:var(--accent);min-height:2px}
.ddays i.o{background:var(--ink);opacity:.7}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;min-height:34px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.betline{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--dim);border-radius:8px;padding:8px 10px;font-size:14px}

<script>
(function(){
"use strict";
var LS='gymlog.v1';
var DEFAULTS=[
 {id:'push',name:'Push',ex:['Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Triceps Pushdown','Overhead Triceps Extension']},
 {id:'pull',name:'Pull',ex:['Lat Pulldown','Barbell Row','Seated Cable Row','Face Pull','Barbell Curl','Hammer Curl']},
 {id:'legs',name:'Legs',ex:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Calf Raise']},
 {id:'upper',name:'Upper',ex:['Bench Press','Lat Pulldown','Overhead Press','Seated Cable Row','Lateral Raise','Barbell Curl','Triceps Pushdown']}
];
var S={config:null,sessions:{}};
var UI={auth:'wait',tab:'train',editing:null,ex:null,metric:'top',open:null,confirm:null,swap:null,offer:null};
var IDX={};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(n){return String(n).trim().toLowerCase().replace(/\s+/g,' ')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function f(n){return String(Math.round(n*100)/100)}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)||n<0?'':n}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function day0(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function dshort(t){var d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]}
function dlong(t){var d=new Date(t);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function ago(t){var n=Math.round((day0(Date.now())-day0(t))/864e5);return n<=0?'today':n===1?'yesterday':n+' days ago'}

/* ---------- storage: Firebase, same project and login as the Library app ---------- */
var FBC={"apiKey":"AIzaSyA63SpccuM6LDWiMn1_BQVjsWcNJGl5_NA","authDomain":"nabulsi-project.firebaseapp.com","projectId":"nabulsi-project","storageBucket":"nabulsi-project.firebasestorage.app","messagingSenderId":"311435368989","appId":"1:311435368989:web:214a7d2e452b9552f284f4"};
var FBV='10.12.2',FB={},me=null,pending=0,timers={};
function lsKey(){return LS+(me?'.'+me:'')}
function loadLocal(){S={config:null,sessions:{}};try{var r=JSON.parse(localStorage.getItem(lsKey())||'null');if(r&&r.sessions)S={config:r.config||null,sessions:r.sessions,profile:r.profile||null}}catch(e){}}
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){}}
function setSync(s){var el=$('#sync');el.dataset.s=s;el.textContent={loading:'Loading',saving:'Syncing',saved:'Saved',error:'Not saved online',out:''}[s]}
function ref(id){return FB.doc(FB.db,'gym',me,'docs',id)}
function track(p){pending++;setSync('saving');p.then(function(){pending--;if(!pending)setSync('saved')},function(e){pending--;UI.dbErr=(e&&e.code)||'error';setSync('error')})}
function push(id){clearTimeout(timers[id]);delete timers[id];if(!me||!FB.ready)return;var body=id==='config'?S.config:id==='profile'?S.profile:S.sessions[id];if(body)track(FB.setDoc(ref(id),clone(body)))}
function touch(id){saveLocal();if(typeof publishSoon==='function'&&id!=='config')publishSoon();if(typeof checkTrophiesSoon==='function'&&id!=='profile')checkTrophiesSoon();if(!me||!FB.ready)return;clearTimeout(timers[id]);timers[id]=setTimeout(function(){push(id)},600)}

document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')Object.keys(timers).forEach(push)});
async function loadFirebase(){
  if(FB.ready)return;
  var app=await import('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-app.js');
  var fs=await import('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-firestore.js');

  Object.assign(FB,fs);FB.A=au;
  var a=app.initializeApp(FBC);
  try{FB.db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){FB.db=fs.getFirestore(a)}
  FB.auth=au.getAuth(a);FB.ready=true;
}
async function connect(){
  try{await loadFirebase()}catch(e){UI.auth='offline';render();return}
  FB.A.onAuthStateChanged(FB.auth,async function(u){

    me=u.uid;UI.auth='in';UI.email=u.email||'';UI.dbErr=null;loadLocal();render();setSync('loading');
    try{
      var snap=await FB.getDocs(FB.collection(FB.db,'gym',me,'docs')),cfg=null,pf=null,ss={},keep=Object.keys(timers);
      snap.forEach(function(d){var x=d.data();if(d.id==='config')cfg=x;else if(d.id==='profile')pf=x;else if(x&&x.kind==='session')ss[d.id]=x});
      keep.forEach(function(id){if(id==='config')cfg=S.config;else if(id==='profile')pf=S.profile;else if(S.sessions[id])ss[id]=S.sessions[id]});
      S.sessions=ss;if(cfg&&cfg.routines)S.config=cfg;if(pf)S.profile=pf;
      saveLocal();render();
      if(!cfg)touch('config');
      setSync(pending||Object.keys(timers).length?'saving':'saved');
      startCrews();
    }catch(e){UI.dbErr=(e&&e.code)||'error';setSync('error');render()}
  });
}
function authMsg(e){var c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'That email and password don\'t match. Try again.';
  if(/email-already-in-use/.test(c))return 'That email already has an account. Sign in instead.';
  if(/weak-password/.test(c))return 'Use a password of at least 6 characters.';
  if(/operation-not-allowed/.test(c))return 'New accounts are switched off for this app.';
  if(/invalid-email|missing-email/.test(c))return 'Enter a valid email address.';
  if(/missing-password/.test(c))return 'Enter your password.';
  if(/too-many-requests/.test(c))return 'Too many tries. Wait a minute, then try again.';
  if(/network/.test(c))return 'No connection. Check your internet and try again.';
  return 'That didn\'t work. Try again.'}
function viewAuth(){
  if(UI.auth==='offline')return '<div class="card"><h2>No connection</h2><div class="muted">The app needs the internet the first time it opens. Check your connection, then try again.</div><button class="btn primary" data-act="reload">Try again</button></div>';

  return '<div class="card"><h2>'+(up?'Create account':'Sign in')+'</h2><div class="muted small">'+(up?'Pick an email and a password of at least 6 characters. Your workouts are private to your account.':'Already use the Library app? The same email and password work here.')+'</div>'+
    '<label class="label" for="email">Email</label><input class="text" id="email" type="email" autocomplete="username" inputmode="email" value="'+esc(UI.emailIn||'')+'">'+
    '<label class="label" for="pw">Password</label><input class="text" id="pw" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'+

    '<button class="btn primary big" data-act="'+(up?'signup':'signin')+'">'+(UI.busy?'One moment':up?'Create account':'Sign in')+'</button>'+
    '<button class="btn" data-act="authmode">'+(up?'I already have an account':'New here? Create an account')+'</button>'+
    (up?'':'<button class="link" data-act="reset">Forgot your password? Email me a reset link</button>')+'</div>';
}

/* ---------- derived ---------- */
function done(){return Object.keys(S.sessions).map(function(k){return S.sessions[k]}).filter(function(s){return s.done}).sort(function(a,b){return a.start-b.start})}
function active(){var k=Object.keys(S.sessions);for(var i=0;i<k.length;i++)if(!S.sessions[k[i]].done)return S.sessions[k[i]];return null}
function buildIndex(){
  IDX={};
  done().forEach(function(s){(s.items||[]).forEach(function(it){
    var sets=(it.sets||[]).filter(function(x){return x.ok});if(!sets.length)return;
    var k=key(it.name);if(!IDX[k])IDX[k]={name:it.name,log:[]};
    IDX[k].name=it.name;IDX[k].log.push({t:s.start,sets:sets,note:it.note||''});
  })});
  Object.keys(IDX).forEach(function(k){IDX[k].st=stats(IDX[k])});
  var names={};S.config.routines.forEach(function(r){r.ex.forEach(function(n){names[key(n)]=n})});
  Object.keys(IDX).forEach(function(k){names[k]=IDX[k].name});
  $('#exnames').innerHTML=Object.keys(names).sort().map(function(k){return '<option value="'+esc(names[k])+'">'}).join('');
}
function top(sets){return Math.max.apply(null,sets.map(function(x){return +x.w||0}))}
function vol(sets){return sets.reduce(function(a,x){return a+(+x.w||0)*(+x.r||0)},0)}
function repTxt(x){return x.f?((+x.r>0?x.r:'')+' to failure').trim():String(x.r)}
function setsText(sets){return sets.map(function(x){return f(+x.w||0)+'×'+(x.f?(+x.r>0?x.r+'F':'F'):x.r)}).join(' · ')+(sets.some(function(x){return x.f})?' (F = to failure)':'')}

/* ---------- actions ---------- */
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2600)}
function startWorkout(r){
  var s={kind:'session',id:uid('s'),start:Date.now(),routine:r?r.name:'Workout',rid:r?r.id:null,done:false,items:[]};
  (r?r.ex:[]).forEach(function(n){s.items.push(newItem(n))});
  S.sessions[s.id]=s;touch(s.id);window.scrollTo(0,0);
}
function newItem(n){
  var h=IDX[key(n)],last=h&&h.log[h.log.length-1];
  return {name:n,note:last?last.note:'',sets:last?last.sets.map(function(x){var o={w:x.w,r:x.r,ok:false};if(x.f)o.f=true;return o}):[{w:'',r:'',ok:false},{w:'',r:'',ok:false},{w:'',r:'',ok:false}]};
}
function checkPR(a,i,j){
  var it=a.items[i],st=it.sets[j],h=IDX[key(it.name)];delete st.pr;
  if(!h||!st.ok)return;
  var w=+st.w||0,r=+st.r||0,bestW=0,bestR=0,seenW=false;
  var prev=[];h.log.forEach(function(l){prev=prev.concat(l.sets)});
  it.sets.forEach(function(x,k){if(k!==j&&x.ok)prev.push(x)});
  prev.forEach(function(x){var xw=+x.w||0;if(xw>bestW)bestW=xw;if(xw===w){seenW=true;if(+x.r>bestR)bestR=+x.r}});
  if(w>bestW&&w>0){st.pr='Heaviest yet';say('New best: '+it.name+' '+f(w)+' kg. Light work.')}
  else if(seenW&&r>bestR){st.pr='Most reps at '+f(w)+' kg';say('New best: '+it.name+' '+f(w)+' kg for '+r+'. Strong.')}
}
function finish(){
  var a=active();if(!a)return;
  a.items.forEach(function(it){it.sets=it.sets.filter(function(x){return x.ok})});
  a.items=a.items.filter(function(it){return it.sets.length});
  if(!a.items.length){remove(a.id);toast('Nothing ticked, so nothing was saved');return}
  var before={},rb=rankedBests(),thBefore={};myCrews().forEach(function(cid){if(CREW[cid])thBefore[cid]=titleHolders(cid)});a.items.forEach(function(it){var e=IDX[key(it.name)];before[key(it.name)]=e?e.st.level:0});
  a.done=true;a.end=Date.now();touch(a.id);window.scrollTo(0,0);buildIndex();
  var ups=[];a.items.forEach(function(it){var k=key(it.name),e=IDX[k];if(e&&before[k]&&e.st.level>before[k])ups.push(it.name+' is now level '+e.st.level)});
  say(ups.length?'Level up. '+ups.join(', ')+'.':'Workout saved. Good session.');
  var ra=rankedBests(),now=Date.now(),evs=[],nset=0,wv=0;a.items.forEach(function(it){nset+=it.sets.length;wv+=vol(it.sets)});
  RANKED.forEach(function(r){var x=ra[r.id],y=rb[r.id];if(!x||x.t!==a.start||(y&&x.v<=y.v+0.01))return;
    var ev={id:me+'_'+now+'_'+r.id,type:'pr',lift:r.id,t:now,text:(y?'New ':'First ')+r.name+' best: '+f(x.w)+(r.bw?' kg added':' kg')+' × '+x.r+' ('+Math.round(x.v)+' kg est.)'};
    if(y&&x.v>y.v*1.3+5)ev.flag=1;evs.push(ev)});
  evs.unshift({id:me+'_'+now+'_w',type:'workout',t:now,routine:a.routine,ex:a.items.map(function(it){return it.name}).slice(0,10),text:'Finished '+a.routine+': '+nset+(nset===1?' set':' sets')+', '+nfmt(wv)+' kg lifted'});
  var lost=prof().lost||{};Object.keys(thBefore).forEach(function(cid){var af=titleHolders(cid);RANKED.forEach(function(r){TITLES.forEach(function(T){
    var b0=thBefore[cid][r.id][T.id],a0=af[r.id][T.id];if(!b0||!a0||b0.uid===me||a0.uid!==me)return;
    evs.push({id:me+'_'+now+'_s'+T.id+r.id,type:'steal',t:now,text:'Took the '+r.name+' '+T.name+' from @'+b0.name+'.'});
    if(b0.x&&b0.x.t&&now-b0.x.t<864e5)cnt('thief');
    if(lost[T.id+':'+r.id]===b0.uid){cnt('revenge');delete lost[T.id+':'+r.id]}})})});
  ups.forEach(function(u,i){evs.push({id:me+'_'+now+'_l'+i,type:'level',t:now,text:u})});
  addEvents(evs);
  var r=a.rid&&routine(a.rid),names=a.items.map(function(it){return it.name});
  UI.offer=r&&names.map(key).join('|')!==r.ex.map(key).join('|')?{rid:r.id,ex:names}:null;
}
function routine(id){return S.config.routines.filter(function(r){return r.id===id})[0]}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,a=active(),i=+b.dataset.i,j=+b.dataset.j,r,it,st,inp,v;
  if(act!=='ask'&&act!=='yes'&&act!=='back')UI.confirm=null;
  if(act!=='swapopen'&&act!=='swapdo')UI.swap=null;
  switch(act){
    case 'reload':location.reload();return;
    case 'authmode':UI.mode=UI.mode==='signup'?'signin':'signup';UI.authErr=UI.authNote=null;var e0=$('#email');if(e0)UI.emailIn=e0.value.trim();break;
    case 'signin':case 'signup':case 'reset':
      var em=$('#email').value.trim(),pw=$('#pw').value;UI.emailIn=em;UI.authErr=UI.authNote=null;
      if(act==='reset'){if(!em){UI.authErr='Enter your email first, then tap the reset link.';break}
        FB.A.sendPasswordResetEmail(FB.auth,em).then(function(){UI.authNote='Reset link sent. Check your email.';render()},function(e){UI.authErr=authMsg(e);render()});break}
      if(act==='signup'&&pw.length<6){UI.authErr='Use a password of at least 6 characters.';break}
      UI.busy=true;(act==='signup'?FB.A.createUserWithEmailAndPassword(FB.auth,em,pw):FB.A.signInWithEmailAndPassword(FB.auth,em,pw)).catch(function(e){UI.busy=false;UI.authErr=authMsg(e);render()});break;
    case 'signout':Object.keys(timers).forEach(push);FB.A.signOut(FB.auth);return;
    case 'saveuname':saveUsername();return;
    case 'joinyes':joinCrew();return;
    case 'joinno':UI.join=null;try{sessionStorage.removeItem('gymlog.join')}catch(x){}break;
    case 'mkcrew':createCrew();return;
    case 'pickcrew':UI.crew=b.dataset.c;UI.inbox=null;UI.showInvite=false;break;
    case 'forgetcrew':var fc=b.dataset.c;unsubCrew(fc);prof().crews=myCrews().filter(function(x){return x!==fc});touch('profile');UI.crew=null;break;
    case 'invite':UI.showInvite=!UI.showInvite;break;
    case 'copylink':var lk=inviteLink(activeCrew());if(navigator.clipboard)navigator.clipboard.writeText(lk).then(function(){toast('Invite link copied')},function(){var el=$('#invlink');if(el){el.select();toast('Select and copy the link')}});return;
    case 'sharelink':var lk2=inviteLink(activeCrew()),cn=(CREW[activeCrew()]||{}).name||'';if(navigator.share)navigator.share({title:'Gym Log crew',text:'Join my crew "'+cn+'" on Gym Log',url:lk2}).catch(function(){});else toast('Use WhatsApp or Copy instead');return;
    case 'respect':toggleRespect(activeCrew(),b.dataset.e);return;
    case 'feedall':UI.feedAll=!UI.feedAll;break;
    case 'member':if(b.dataset.u===me)break;UI.member=b.dataset.u;UI.h2hLift=null;window.scrollTo(0,0);break;
    case 'memberback':UI.member=null;window.scrollTo(0,0);break;
    case 'h2hlift':UI.h2hLift=b.dataset.l;break;
    case 'logbw':var bv=num($('#bwin').value);UI.bwErr=null;
      if(bv===''||bv<25||bv>350){UI.bwErr='Enter your bodyweight in kg, between 25 and 350.';break}
      var pp=prof(),td=day0(Date.now());pp.bw=pp.bw.filter(function(x){return day0(x.t)!==td});pp.bw.push({t:Date.now(),kg:Math.round(bv*10)/10});
      pp.bw.sort(function(x,y){return x.t-y.t});if(pp.bw.length>400)pp.bw=pp.bw.slice(-400);touch('profile');say('Weigh-in logged: '+f(bv)+' kg.');break;
    case 'tab':UI.unameErr=UI.unameOk=UI.bwErr=null;UI.unameIn=null;UI.member=null;UI.crewErr=null;if(b.dataset.t==='crew'&&UI.tab!=='crew')UI.inbox=null;UI.tab=b.dataset.t;UI.ex=null;UI.editing=null;window.scrollTo(0,0);break;
    case 'start':startWorkout(routine(b.dataset.id));break;
    case 'blank':startWorkout(null);break;
    case 'inc':case 'dec':
      st=a.items[i].sets[j];var fld=b.dataset.f,stepv=fld==='w'?2.5:1;
      v=(+st[fld]||0)+(act==='inc'?stepv:-stepv);if(v<0)v=0;
      setField(a,i,j,fld,v);touch(a.id);return;
    case 'fail':st=a.items[i].sets[j];if(st.f)delete st.f;else st.f=true;if(st.ok)checkPR(a,i,j);touch(a.id);break;
    case 'tick':
      st=a.items[i].sets[j];
      if(!st.ok){if(!(+st.r>0)&&!st.f){toast('Enter the reps, or tap To failure');return}st.w=+st.w||0;st.ok=true;checkPR(a,i,j)}else{st.ok=false;delete st.pr}
      touch(a.id);break;
    case 'addset':it=a.items[i];st=it.sets[it.sets.length-1];var ns={w:st?st.w:'',r:st?st.r:'',ok:false};if(st&&st.f)ns.f=true;it.sets.push(ns);touch(a.id);break;
    case 'rmset':it=a.items[i];if(it.sets.length>1){it.sets.pop();touch(a.id);cnt('rmset')}break;
    case 'rmex':a.items.splice(i,1);touch(a.id);break;
    case 'mvup':case 'mvdown':var q=act==='mvup'?i-1:i+1;if(q>=0&&q<a.items.length){it=a.items[i];a.items[i]=a.items[q];a.items[q]=it;touch(a.id)}break;

 {id:'bench',name:'Bench Press',re:/\bbench\b/,not:/incline|decline|dumbbell|\bdb\b|close|machine|smith|floor/},
 {id:'incline',name:'Incline Bench Press',re:/incline.*(bench|press)/,not:/dumbbell|\bdb\b|machine|smith/},
 {id:'squat',name:'Squat',re:/squat/,not:/goblet|split|hack|front|bulgarian|smith|jump|pistol|sissy|dumbbell|\bdb\b|leg press/},
 {id:'deadlift',name:'Deadlift',re:/deadlift/,not:/romanian|\brdl\b|stiff|single|dumbbell|\bdb\b|trap|hex/},
 {id:'ohp',name:'Overhead Press',re:/overhead press|military|\bohp\b|standing press|shoulder press/,not:/dumbbell|\bdb\b|machine|smith|seated|arnold/},
 {id:'row',name:'Barbell Row',re:/barbell row|bent.?over row|pendlay/,not:/dumbbell|\bdb\b|cable|machine|t.?bar/},
 {id:'pullup',name:'Pull-up',re:/pull.?up|chin.?up/,not:/assist|band|machine|lat/,bw:true},
 {id:'dip',name:'Dip',re:/\bdips?\b/,not:/assist|machine|bench dip/,bw:true}
];
function rankedById(id){for(var i=0;i<RANKED.length;i++)if(RANKED[i].id===id)return RANKED[i];return null}
function rankOf(name){
  var k=key(name),m=(S.config&&S.config.rankMap)||{};
  if(Object.prototype.hasOwnProperty.call(m,k))return m[k]==='none'?null:rankedById(m[k]);
  for(var i=0;i<RANKED.length;i++){var r=RANKED[i];if(r.re.test(k)&&!r.not.test(k))return r}
  return null;
}
function prof(){if(!S.profile)S.profile={kind:'profile',username:'',bw:[]};S.profile.bw=S.profile.bw||[];return S.profile}
function bwAt(t){var l=prof().bw,best=null,i;for(i=0;i<l.length;i++){if(l[i].t<=t&&(!best||l[i].t>best.t))best=l[i]}if(!best&&l.length)best=l.reduce(function(a,b){return a.t<b.t?a:b});return best?best.kg:0}
function bwNow(){var l=prof().bw;return l.length?l.reduce(function(a,b){return a.t>b.t?a:b}).kg:0}
/* Epley estimate. Reps above 12 are counted as 12 so long sets don't inflate it. */
function e1rm(load,r){r=Math.min(+r||0,12);if(r<1||!(load>0))return 0;return r===1?load:load*(1+r/30)}
function rankedBests(){
  var out={};RANKED.forEach(function(r){out[r.id]=null});
  done().forEach(function(s){s.items.forEach(function(it){var r=rankOf(it.name);if(!r)return;
    it.sets.forEach(function(x){var bw=bwAt(s.start),load=(+x.w||0)+(r.bw?bw:0),v=e1rm(load,x.r);
      if(v>0&&(!out[r.id]||v>out[r.id].v))out[r.id]={v:v,t:s.start,w:+x.w||0,r:+x.r,bw:bw,ex:it.name}})})});
  return out;
}

async function saveUsername(){
  var raw=($('#uname').value||'').trim().replace(/^@/,''),name=raw.toLowerCase(),p=prof();
  UI.unameIn=raw;UI.unameErr=UI.unameOk=null;
  if(!/^[a-z0-9_]{3,20}$/.test(name)){UI.unameErr='Use 3 to 20 letters, numbers or _ (no spaces).';render();return}
  if(name===p.username){UI.unameOk='That\'s already your username.';render();return}
  if(!me||!FB.ready){UI.unameErr='You need to be online to pick a username.';render();return}
  UI.unameBusy=true;render();
  try{
    await FB.setDoc(FB.doc(FB.db,'gymUsernames',name),{uid:me});
    var old=p.username;p.username=name;push('profile');
    if(old){try{await FB.deleteDoc(FB.doc(FB.db,'gymUsernames',old))}catch(e){}}
    UI.unameIn=null;UI.unameOk='Saved. You\'re @'+name+'.';
  }catch(e){
    var mine=false;try{var d=await FB.getDoc(FB.doc(FB.db,'gymUsernames',name));mine=d.exists()&&d.data().uid===me}catch(x){}
    if(mine){p.username=name;push('profile');UI.unameIn=null;UI.unameOk='Saved. You\'re @'+name+'.'}
    else UI.unameErr=(e&&e.code==='permission-denied')?'@'+name+' is taken. Try another.':'Couldn\'t save. Check your connection and try again.';

/* --- what the crew sees about you --- */
function rankedHist(){
  var h={};RANKED.forEach(function(r){h[r.id]=[]});
  done().forEach(function(s){var best={};
    s.items.forEach(function(it){var r=rankOf(it.name);if(!r)return;it.sets.forEach(function(x){var v=e1rm((+x.w||0)+(r.bw?bwAt(s.start):0),x.r);if(v>(best[r.id]||0))best[r.id]=v})});
    Object.keys(best).forEach(function(id){var l=h[id],last=l.length?l[l.length-1][1]:0;if(best[id]>last+0.01)l.push([s.start,Math.round(best[id]*10)/10])})});
  Object.keys(h).forEach(function(id){h[id]=h[id].slice(-24)});
  return h;
}
function myStats(){
  var p=prof(),b=rankedBests(),hist=rankedHist(),ranked={},ws=weekStart(Date.now()),wk={start:ws,sessions:0,volume:0,prs:0},tot={sessions:0,volume:0};
  var win=windowStats();
  RANKED.forEach(function(r){var x=b[r.id];if(!x)return;var o={v:Math.round(x.v*10)/10,w:x.w,r:x.r,t:x.t,hist:hist[r.id]};if(x.bw>0)o.ratio=Math.round(x.v/x.bw*100)/100;
    var wn=win[r.id];if(wn.h)o.h90=wn.h;if(wn.p)o.p90=wn.p;o.s90=wn.s;if(wn.g>0)o.g30=wn.g;ranked[r.id]=o});
  done().forEach(function(s){var v=0;s.items.forEach(function(it){v+=vol(it.sets)});tot.sessions++;tot.volume+=v;if(s.start>=ws){wk.sessions++;wk.volume+=v}});
  (p.events||[]).forEach(function(e){if(e.type==='pr'&&e.t>=ws)wk.prs++});
  wk.volume=Math.round(wk.volume);tot.volume=Math.round(tot.volume);
  wk.days=dayPoints(ws);var lws=ws-7*864e5,lw={start:lws,days:dayPoints(lws),sessions:0,volume:0,prs:0};
  done().forEach(function(s){if(s.start>=lws&&s.start<ws){lw.sessions++;s.items.forEach(function(it){lw.volume+=vol(it.sets)})}});lw.volume=Math.round(lw.volume);
  (p.events||[]).forEach(function(e){if(e.type==='pr'&&e.t>=lws&&e.t<ws)lw.prs++});
  var dd=done(),dt=duelTotals();
  return {avatar:p.avatar||{a:'🐻',c:'#ffb21f'},last:dd.length?dd[dd.length-1].start:0,lastWeek:lw,duels:dt,name:p.username,ranked:ranked,week:wk,total:tot,feed:(p.events||[]).slice(-20),trophies:Object.keys(p.trophies||{}).slice(0,60),shame:(p.shame||[]).slice(0,10),showcase:(p.showcase||[]).slice(0,3)};
}
var pubTimer=null;

function publishStats(){

/* --- live crew data --- */
function subCrew(cid){
  if(CREW[cid])return;var c=CREW[cid]={name:'',owner:'',code:'',members:{},stats:{},respect:{},unsub:[]};
  FB.getDoc(FB.doc(FB.db,'gymCrews',cid)).then(function(d){if(d.exists()){c.name=d.data().name;c.owner=d.data().owner}else c.gone=true;render()},function(){});
  FB.getDoc(FB.doc(FB.db,'gymCrews',cid,'secret','join')).then(function(d){if(d.exists())c.code=d.data().code;render()},function(){});
  var err=function(e){if(e&&e.code==='permission-denied'){c.lost=true;render()}};
  c.unsub.push(FB.onSnapshot(FB.collection(FB.db,'gymCrews',cid,'members'),function(s){var m={};s.forEach(function(d){m[d.id]=d.data()});c.members=m;render()},err));
  c.unsub.push(FB.onSnapshot(FB.collection(FB.db,'gymCrews',cid,'stats'),function(s){var m={};s.forEach(function(d){m[d.id]=d.data()});c.stats=m;render();checkTrophiesSoon()},err));
  c.unsub.push(FB.onSnapshot(FB.collection(FB.db,'gymCrews',cid,'respect'),function(s){var m={};s.forEach(function(d){m[d.id]=d.data()});c.respect=m;render();checkTrophiesSoon()},err));
}
function unsubCrew(cid){unsubExtras(cid);var c=CREW[cid];if(!c)return;c.unsub.forEach(function(f){try{f()}catch(e){}});delete CREW[cid]}

function memberStats(cid){var c=CREW[cid];if(!c)return [];var l=Object.keys(c.stats).filter(function(u){return c.members[u]&&u!==me}).map(function(u){var s=c.stats[u];return {uid:u,name:s.name||'someone',s:s}});
  if(prof().username)l.push({uid:me,name:prof().username,s:myStats()});return l}
function crownHolders(cid){
  var out={};RANKED.forEach(function(r){var best=null;memberStats(cid).forEach(function(m){var x=m.s.ranked&&m.s.ranked[r.id];if(!x||!(x.ratio>0))return;
    if(!best||x.ratio>best.x.ratio||(x.ratio===best.x.ratio&&x.t<best.x.t))best={uid:m.uid,name:m.name,x:x}});out[r.id]=best});
  return out;
}
function crewFeed(cid){

}

/* --- inbox: what happened since you last looked --- */
function seenKey(cid){return 'gymlog.seen.'+me+'.'+cid}
function crownKey(cid){return 'gymlog.crowns.'+me+'.'+cid}
function inboxItems(cid){
  var seen=lsGet(seenKey(cid),0),items=[];
  crewFeed(cid).forEach(function(f){if(f.uid!==me&&f.e.t>seen)items.push({t:f.e.t,text:'@'+f.name+': '+f.e.text})});
  var xx=X[cid]||{};
  Object.keys(xx.taunts||{}).forEach(function(k){var t=xx.taunts[k];if(t.to===me&&t.t>seen)items.push({t:t.t,hot:true,text:'@'+nameOf(cid,t.from)+' says: "'+t.text+'"'})});
  Object.keys(xx.callouts||{}).forEach(function(k){var t=xx.callouts[k];if(t.to===me&&t.t>seen){var rr=rankedById(t.lift)||{name:t.lift};items.push({t:t.t,hot:true,text:'@'+nameOf(cid,t.by)+' called you out: beat '+rr.name+' '+f(t.w)+' × '+t.r+' within 7 days.'})}});
  Object.keys(xx.bets||{}).forEach(function(k){var t=xx.bets[k];if(t.b===me&&!t.accepted&&t.t>seen)items.push({t:t.t,text:'@'+nameOf(cid,t.a)+' bet '+t.stake+' on your duel. Accept it on the duel card.'})});
  Object.keys(xx.hats||{}).forEach(function(k){var t=xx.hats[k];if(t.to===me&&t.t>seen)items.push({t:t.t,hot:true,text:'@'+nameOf(cid,t.by)+' picked your hat this week: '+t.hat})});
  Object.keys(xx.spots||{}).forEach(function(k){if(k.indexOf(me+'_')!==0)return;var t=xx.spots[k];Object.keys(t).forEach(function(u){if(u!==me&&t[u]>seen)items.push({t:t[u],text:'@'+nameOf(cid,u)+' spotted your new best ✓'})})});
  var prev=lsGet(crownKey(cid),null),now=titleHolders(cid);
  if(prev&&prev._v===2)RANKED.forEach(function(r){TITLES.forEach(function(T){var k=T.id+':'+r.id,p=prev[k],x=now[r.id][T.id],n=x&&x.uid;
    if(p===me&&n&&n!==me)items.push({t:Date.now(),hot:true,text:'@'+x.name+' took your '+r.name+' '+T.name+'. Your move.'});
    else if(n===me&&p!==me)items.push({t:Date.now(),text:'You took the '+r.name+' '+T.name+'.'})})});
  return items.sort(function(a,b){return b.t-a.t}).slice(0,12);
}
function markSeen(cid){

function chart2(a,b,labA,labB){
  var all=a.concat(b);if(!all.length)return '';
  var W=340,H=180,L=38,R=16,T=18,B=34,lo=Infinity,hi=-Infinity,t0=Infinity,t1=-Infinity;

  if(lo===hi){lo-=5;hi+=5}var st=niceStep((hi-lo)/3);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;
  function x(t){return t1===t0?(L+W-R)/2:L+(t-t0)/(t1-t0)*(W-L-R)}function y(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)}

  function line(pts,col,dash){if(!pts.length)return '';var d=pts.map(function(p,i){return (i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)}).join(' '),e=pts[pts.length-1];

  return h;
}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),q=x/p;return (q<=1?1:q<=2?2:q<=2.5?2.5:q<=5?5:10)*p}
function chart(pts){
  var W=340,H=176,L=38,R=16,T=22,B=24,lo=Infinity,hi=-Infinity;
  pts.forEach(function(p){if(p.v<lo)lo=p.v;if(p.v>hi)hi=p.v});
  if(lo===hi){lo=Math.max(0,lo-5);hi=hi+5}
  var st=niceStep((hi-lo)/3);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;
  var t0=pts[0].t,t1=pts[pts.length-1].t;
  function x(p){return t1===t0?(L+W-R)/2:L+(p.t-t0)/(t1-t0)*(W-L-R)}
  function y(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)}
  var g='',v,n=0;
  for(v=lo;v<=hi+st/1e3&&n<12;v+=st,n++){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+f(v)+'</text>'}
  var line=pts.map(function(p,i){return (i?'L':'M')+x(p).toFixed(1)+' '+y(p.v).toFixed(1)}).join(' ');
  var lastp=pts[pts.length-1],area=pts.length>1?'<path d="'+line+' L'+x(lastp).toFixed(1)+' '+(H-B)+' L'+x(pts[0]).toFixed(1)+' '+(H-B)+' Z" fill="var(--marigold)" opacity=".3"/>':'';
  var dots=pts.map(function(p,i){var e=i===pts.length-1;return '<circle cx="'+x(p).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(e?5:2.5)+'" fill="var(--accent)"'+(e?' stroke="var(--surface)" stroke-width="2"':'')+'/>'}).join('');
  var lx=x(lastp),anchor=lx>W-60?'end':'middle',ly=Math.max(14,y(lastp.v)-10);
  var lbl='<text class="val" x="'+(anchor==='end'?W-R+4:lx).toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'">'+f(lastp.v)+'</text>';
  var xl='<text x="'+L+'" y="'+(H-6)+'">'+dshort(t0)+'</text>'+(t1!==t0?'<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dshort(t1)+'</text>':'');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Chart over time">'+g+area+'<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lbl+xl+'</svg>';
}
function spark(vals){
  if(vals.length<2)return '';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),W=60,H=24;
  var p=vals.map(function(v,i){return (i/(vals.length-1)*(W-6)+3).toFixed(1)+','+(hi===lo?H/2:3+(1-(v-lo)/(hi-lo))*(H-6)).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="60" height="24" aria-hidden="true"><polyline points="'+p+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function viewProgress(){
  var ks=Object.keys(IDX);
  if(UI.ex&&IDX[UI.ex])return viewExercise(IDX[UI.ex]);
  if(!ks.length)return '<div class="row"><button class="btn" data-act="tab" data-t="train" aria-label="Back to Train">‹ Back</button><h2 class="grow">Progress</h2></div><div class="card empty">Finish your first workout and each exercise shows up here with a chart of your weights over time.</div>';
  ks.sort(function(a,b){var la=IDX[a].log,lb=IDX[b].log;return lb[lb.length-1].t-la[la.length-1].t});
  return '<div class="row"><button class="btn" data-act="tab" data-t="train" aria-label="Back to Train">‹ Back</button><h2 class="grow">Progress</h2></div><section class="card"><div class="list">'+ks.map(function(k){
    var e=IDX[k],tops=e.log.map(function(l){return top(l.sets)}),now=tops[tops.length-1],diff=now-tops[0];
    return '<button class="item" data-act="ex" data-k="'+esc(k)+'"><span class="grow"><b>'+esc(e.name)+'</b> <span class="lv">Lv '+e.st.level+'</span><br><span class="small muted">'+e.log.length+(e.log.length===1?' session':' sessions')+(diff>0?' · <span class="up">+'+f(diff)+' kg</span>':'')+'</span></span>'+spark(tops)+'<span class="num">'+f(now)+'<small>kg</small></span></button>';
  }).join('')+'</div></section>';
}
function viewExercise(e){
  var log=e.log,tops=log.map(function(l){return top(l.sets)}),best=Math.max.apply(null,tops),m=UI.metric;
  var pts=log.map(function(l){return {t:l.t,v:m==='vol'?vol(l.sets):top(l.sets)}});
  var h='<div class="row"><button class="btn" data-act="exback" aria-label="Back to all exercises">‹ Back</button><h2 class="grow">'+esc(e.name)+'</h2></div>';
  h+='<div class="stats"><div class="stat"><b>'+f(tops[tops.length-1])+'</b><span>Latest kg</span></div><div class="stat"><b>'+f(best)+'</b><span>Best kg</span></div><div class="stat"><b>'+e.st.level+'</b><span>Level</span></div></div>';
  var rk=rankOf(e.name),eb=0,ebl=null;e.log.forEach(function(l){l.sets.forEach(function(x){var v=e1rm((+x.w||0)+(rk&&rk.bw?bwAt(l.t):0),x.r);if(v>eb){eb=v;ebl={v:v,bw:bwAt(l.t)}}})});
  if(eb)h+='<div class="row between small"><span class="muted">Estimated one-rep max'+ib('estmax')+'</span><span><b class="num" style="font-size:22px">'+Math.round(eb)+'</b> kg'+(rk&&ebl.bw?' · '+nf1(eb/ebl.bw)+'× bodyweight':'')+'</span></div>';
  h+='<div class="row between small muted"><span>'+ib('xp')+' '+xpBar(e.st)+' &nbsp;'+(50-e.st.into)+' XP to level '+(e.st.level+1)+'</span><span>Session 10 XP, new best 30</span></div>';
  h+='<section class="card"><div class="row between"><span class="small muted">'+(m==='vol'?'Total kg lifted per session':'Heaviest set per session, kg')+'</span><div class="seg"><button data-act="metric" data-m="top" aria-pressed="'+(m!=='vol')+'">Weight</button><button data-act="metric" data-m="vol" aria-pressed="'+(m==='vol')+'">Volume</button></div></div>'+chart(pts)+'</section>';
  h+=rankSelect(e);
  h+='<section class="card"><span class="small muted">Every session</span><div class="detail" style="border-top:0;padding-top:0">'+log.slice().reverse().map(function(l){return '<div><span>'+dlong(l.t)+'</span><span>'+setsText(l.sets)+'</span></div>'}).join('')+'</div></section>';
  return h;
}
function viewHistory(){
  var d=done().reverse();
  if(!d.length)return '<div class="row"><button class="btn" data-act="tab" data-t="train" aria-label="Back to Train">‹ Back</button><h2 class="grow">History</h2></div><div class="card empty">No workouts logged yet. Start one from the Train tab.</div>';
  return '<div class="row"><button class="btn" data-act="tab" data-t="train" aria-label="Back to Train">‹ Back</button><h2 class="grow">History</h2></div>'+d.map(function(s){
    var n=0,v=0;s.items.forEach(function(it){n+=it.sets.length;v+=vol(it.sets)});var open=UI.open===s.id;
    var h='<section class="card"><button class="item" style="padding:0" data-act="open" data-id="'+esc(s.id)+'" aria-expanded="'+open+'"><span class="grow"><h3>'+esc(s.routine)+'</h3><span class="small muted">'+dlong(s.start)+' · '+s.items.length+' exercises · '+n+' sets</span></span><span class="num">'+f(Math.round(v))+'<small>kg</small></span></button>';
    if(open){
      h+='<div class="detail">'+s.items.map(function(it){return '<div><span>'+esc(it.name)+(it.note?'<br><span class="small muted">'+esc(it.note)+'</span>':'')+'</span><span>'+setsText(it.sets)+'</span></div>'}).join('')+'</div>';
      h+=UI.confirm==='del:'+s.id?'<div class="row"><button class="btn danger grow" data-act="yes">Delete for good</button><button class="btn grow" data-act="no">Keep</button></div>':'<div class="row"><button class="btn grow" data-act="reopen" data-id="'+esc(s.id)+'">Edit this workout</button><button class="btn ghost danger" data-act="ask" data-c="del:'+esc(s.id)+'">Delete</button></div>';
    }
    return h+'</section>';
  }).join('');
}
function render(){
  var nav=$('nav');
  if(UI.auth!=='in'){$('#sheet').innerHTML='';nav.hidden=true;$('#bear').innerHTML='';$('#app').innerHTML=viewAuth();return}
  nav.hidden=false;
  if(!S.config||!S.config.routines)S.config={kind:'config',routines:clone(DEFAULTS)};
  buildIndex();
  var a=active(),h;
  if(UI.tab==='crew'){var ac=activeCrew();if(ac&&!UI.inbox&&CREW[ac]&&Object.keys(CREW[ac].stats).length){UI.inbox={cid:ac,items:inboxItems(ac)};markSeen(ac)}}
  if(UI.tab==='profile')h=viewProfile();
  else if(UI.tab==='crew')h=UI.member?viewMember():viewCrew();
  else if(UI.tab==='progress')h=viewProgress();
  else if(UI.tab==='trophies')h=viewTrophyRoom();
  else if(UI.tab==='history')h=viewHistory();
  else if(a)h=viewWorkout(a);
  else if(UI.editing)h=viewEdit();
  else h=viewHome();
  if(UI.dbErr)h='<div class="card" style="border-color:var(--danger)"><b>Your workouts aren\'t saving online yet.</b><div class="small muted">'+(UI.dbErr==='permission-denied'?'The database rule for Gym Log hasn\'t been added in Firebase.':'Check your connection. They\'re kept on this phone until it works.')+'</div></div>'+h;
  $('#app').innerHTML=h;
  $('#sheet').innerHTML=infoSheet()+trophySheet()+unlockOverlay();
  var ul=(UI.unlocks||[])[0];if(ul&&UI.confettiFor!==ul){UI.confettiFor=ul;setTimeout(confetti,60)}
  ['train','progress','trophies','crew','history'].forEach(function(t){var b=$('#nav-'+t);if(UI.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#nav-train').textContent=a?'Workout':'Train';
  var un=UI.tab==='crew'?0:unseenCount();$('#nav-crew').innerHTML='Crew'+(un?'<span class="dot">'+(un>9?'9+':un)+'</span>':'');
  bear();
}
render();connect();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
